<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Submit Your Words</title>
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background-color: #f0f0f0;
            }
            form {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
                background-color: white;
            }
            input {
                font-size: 16px;
                padding: 8px;
                width: 300px;
            }
            button {
                font-size: 16px;
                padding: 10px;
                cursor: pointer;
            }
            #status {
                margin-top: 20px;
                font-size: 1.2em;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1>Submit 5 Words</h1>
        <form id="wordsForm">
            <input type="text" id="word1" placeholder="Word 1" required />
            <input type="text" id="word2" placeholder="Word 2" required />
            <input type="text" id="word3" placeholder="Word 3" required />
            <input type="text" id="word4" placeholder="Word 4" required />
            <input type="text" id="word5" placeholder="Word 5" required />
            <button type="submit">Submit Words</button>
        </form>
        <div id="status">Waiting for all players to submit their words...</div>

        <script src="/socket.io/socket.io.js"></script>
        <script src="words.js"></script>
    </body>
</html>
