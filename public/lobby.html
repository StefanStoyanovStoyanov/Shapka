<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shapka Lobby</title>
        <style>
            body {
                font-family: sans-serif;
                text-align: center;
                padding: 32px 16px;
                margin: 0;
            }
            .teams-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: flex-start;
                gap: 16px;
                margin: 24px auto;
                max-width: 1100px;
            }
            .team-card {
                border: 2px solid #ccc;
                border-radius: 8px;
                padding: 16px;
                min-width: 200px;
                max-width: 320px;
                flex: 1 1 220px;
            }
            .player {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                padding: 8px;
                margin-bottom: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
            button {
                font-size: 15px;
                padding: 9px 12px;
                cursor: pointer;
            }
            button:disabled {
                cursor: not-allowed;
                opacity: 0.55;
            }
            #startGame {
                margin: 12px;
            }
            #status {
                margin-top: 20px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1 id="roomTitle">Loading room...</h1>
        <p id="adminNotice"></p>
        <div id="teams" class="teams-container"></div>
        <button id="startGame" hidden>Start game</button>
        <div id="status" role="status">Waiting for players...</div>

        <script src="/socket.io/socket.io.js"></script>
        <script src="/lobby.js"></script>
    </body>
</html>
